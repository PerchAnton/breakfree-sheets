name: Native Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
      - run: cargo run --locked -- --capabilities
      - run: cargo run --locked -- --version
  native-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev xvfb
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo build --locked --features capture
      - name: Real native framebuffer smoke test (not Windows DPI evidence)
        run: |
          mkdir -p artifacts
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 BREAKFREE_CAPTURE_CELL=C1 BREAKFREE_CAPTURE_TO="$GITHUB_WORKSPACE/artifacts/native-linux.png" ./target/debug/breakfree-sheets --open "$GITHUB_WORKSPACE/examples/first-workbook.bfsheet"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-frame
          path: artifacts/native-linux.png
