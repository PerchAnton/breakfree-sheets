[package]
name = "breakfree-sheets"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[lib]
name = "breakfree_sheets"
path = "src/lib.rs"

[[bin]]
name = "breakfree-sheets"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:rfd"]
capture = ["gui", "image/png"]

[dependencies]
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
eframe = { version = "=0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.8", optional = true, default-features = false, features = ["webp"] }
rfd = { version = "=0.15.4", optional = true }

[[test]]
name = "engine"
path = "tests_rust/engine.rs"

[[test]]
name = "desktop"
path = "tests_rust/desktop.rs"
required-features = ["gui"]
